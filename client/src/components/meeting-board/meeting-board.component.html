<div *ngIf="!data" class="card">Laden…</div>
<div *ngIf="data" class="card">
  <div class="row" style="justify-content: space-between; align-items: center;">
    <h2 style="margin:0;">{{data.meeting.name}}</h2>
    <div class="row" style="gap:8px; align-items:center;">
      <label>Ihr Name:</label>
      <select [(ngModel)]="currentUserId" (ngModelChange)="onCurrentUserSelect($event)">
        <option [ngValue]="null">– auswählen –</option>
        <option *ngFor="let u of allUsers" [ngValue]="u.id">{{u.name}}</option>
      </select>
      <span style="color:#6b7280;">oder erzeugen:</span>
      <input type="text" [(ngModel)]="userName" (ngModelChange)="onUserInputChange()" (keyup.enter)="confirmUser()" (blur)="confirmUserOnBlur()" placeholder="Name" style="width:220px;" />
      <button class="btn" (click)="confirmUser()" [disabled]="!userName.trim() || userExists" [title]="userExists ? 'Benutzer existiert bereits' : ''">Erzeugen</button>

    </div>
  </div>

  <div class="row" style="margin-top:8px; gap:16px;">
    <div class="row" style="gap:8px;">
      <input type="text" [(ngModel)]="newTask" placeholder="Neue WKR Funktion" />
      <button class="btn" (click)="addTask()" [disabled]="!newTask.trim()">+ WKR Funktion</button>
    </div>
    <div class="row" style="gap:8px;">
      <input type="text" [(ngModel)]="newSection" placeholder="Neuer Abschnitt" />
      <button class="btn" (click)="addSection()" [disabled]="!newSection.trim()">+ Abschnitt</button>
    </div>
  </div>

  <div style="overflow:auto; margin-top:12px;">
    <table class="table">
      <thead>
        <tr>
          <th class="sticky-left">WKR Aufgaben / Abschnitt</th>
          <th *ngFor="let s of data.sections">
            <ng-container *ngIf="editingSectionId !== s.id; else editSectionTpl">
              <span (click)="startEditSection(s)" title="Zum Bearbeiten klicken" style="cursor:text;">{{s.name}}</span>
              <button class="btn" title="Abschnitt löschen" (click)="deleteSection(s)" style="margin-left:6px; padding:2px 6px; background:#ef4444;">×</button>
            </ng-container>
            <ng-template #editSectionTpl>
              <input type="text"
                     [(ngModel)]="editSectionName"
                     (keyup.enter)="commitSectionEdit()"
                     (blur)="commitSectionEdit()"
                     (keyup.escape)="cancelSectionEdit()"
                     style="width:140px;" autofocus />
            </ng-template>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of data.tasks">
          <th class="sticky-left" style="text-align:left;">
            <ng-container *ngIf="editingTaskId !== t.id; else editTaskTpl">
              <span (click)="startEditTask(t)" title="Zum Bearbeiten klicken" style="cursor:text;">{{t.name}}</span>
              <button class="btn" title="WKR Funktion löschen" (click)="deleteTask(t)" style="margin-left:6px; padding:2px 6px; background:#ef4444;">×</button>
            </ng-container>
            <ng-template #editTaskTpl>
              <input type="text"
                     [(ngModel)]="editTaskName"
                     (keyup.enter)="commitTaskEdit()"
                     (blur)="commitTaskEdit()"
                     (keyup.escape)="cancelTaskEdit()"
                     style="width:220px;" autofocus />
            </ng-template>
          </th>
          <td *ngFor="let s of data.sections">
            <label style="display:flex; gap:6px; align-items:center; justify-content:center;">
              <input type="checkbox"
                     [checked]="isChecked(t.id, s.id)"
                     (change)="toggle(t, s, $event.target?.checked)"
                     [disabled]="!currentUserId" />
              <span class="cell-users">{{usersFor(t.id, s.id).join(', ')}}</span>
            </label>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div style="margin-top:12px;">
    <h3 style="margin:0 0 6px; font-size:14px; color:#374151;">Eingetragene Benutzer</h3>
    <ul style="list-style:none; padding:0; margin:0; display:flex; gap:8px; flex-wrap:wrap;">
      <li *ngFor="let u of data.users" style="border:1px solid #e5e7eb; padding:4px 8px; border-radius:6px; display:flex; gap:8px; align-items:center;">
        <span [style.fontWeight]="u.id===currentUserId ? '600' : '400'">{{u.name}}</span>
        <button class="btn" style="background:#ef4444;" (click)="deleteUser(u)" [disabled]="false">Löschen</button>
      </li>
    </ul>
  </div>

  <p style="color:#6b7280; font-size:12px; margin-top:8px;">
    Hinweis: Du kannst dich hier aus der angezeigten Veranstaltung löschen. Das löscht nicht deinen Benutzer in den andern Veranstaltungen.
  </p>
</div>
