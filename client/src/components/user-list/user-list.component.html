<section class="user-list">
  <h1>Benutzer</h1>

  <div class="state" *ngIf="loading">Lade Benutzer...</div>
  <div class="state error" *ngIf="!loading && error">{{ error }}</div>

  <div class="actions">
    <button (click)="load()" [disabled]="loading">Neu laden</button>
  </div>

  <form class="add-user" (submit)="$event.preventDefault(); add(nameInput)" *ngIf="!loading">
    <input #nameInput type="text" placeholder="Neuen Benutzername eingeben" [disabled]="loading" />
    <button type="submit" [disabled]="loading">Hinzufügen</button>
  </form>

  <ul *ngIf="!loading && !error">
    <li *ngFor="let u of users">
      <span class="avatar">{{ u.name.charAt(0) | uppercase }}</span>
      <span class="name">{{ u.name }}</span>
      <span class="meta">#{{ u.id }}</span>
      <button class="delete" title="Benutzer löschen" (click)="delete(u)">Löschen</button>
    </li>
    <li *ngIf="users.length === 0" class="empty">Keine Benutzer gefunden.</li>
  </ul>
</section>
